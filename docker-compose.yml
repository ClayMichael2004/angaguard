version: '3.8'

services:
  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
    volumes:
      - ./data:/app/data

  ai-telephony-bridge:
    build:
      context: ./ai-telephony-bridge
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - BACKEND_URL=http://core-backend:8080/api/telemetry

  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - core-backend
